<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151329"><title>AI Film Studio</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#f5f2ff;background:#100f1d}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px;background:linear-gradient(130deg,#292049,#131322)}h1{margin:0;font-size:27px}p{color:#bfb8d2}main{max-width:850px;margin:auto;padding:18px}section{background:#201d32;border:1px solid #39334f;border-radius:16px;padding:17px;margin-bottom:16px}h2{font-size:19px;margin:0 0 13px}label{display:block;margin:12px 0 6px;font-weight:600;font-size:14px}input,textarea,select{width:100%;border:1px solid #514966;border-radius:10px;background:#151326;color:white;padding:12px;font:inherit}textarea{min-height:105px;resize:vertical}button{border:0;border-radius:11px;background:#9d7af7;color:#130e20;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#38324e;color:#f5f2ff}button.danger{background:#663548;color:white}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;background:#171527;border:1px solid #403953;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.item strong{display:block;margin-bottom:6px;color:#dbcaff}.muted{font-size:13px;color:#bcb4cc}.hidden{display:none}footer{text-align:center;padding:15px;color:#a9a2bb;font-size:12px}@media(max-width:540px){.grid{grid-template-columns:1fr}h1{font-size:24px}}</style></head><body><header><h1>🎬 AI Film Studio</h1><p>AI 短劇・音樂 MV 創作工作台</p></header><main><section><h2>📁 作品管理</h2><label for="projects">開啟已儲存作品</label><select id="projects"><option value="">選擇作品</option></select><div class="actions"><button class="secondary" id="new">建立新作品</button><button class="danger" id="delete">刪除目前作品</button></div><p class="muted">資料暫存於本裝置的瀏覽器，請定期匯出備份。</p></section><section><h2>✨ 創作設定</h2><label for="mode">創作模式</label><select id="mode"><option value="短劇">AI 短劇</option><option value="MV">音樂 MV</option></select><label for="name">作品名稱</label><input id="name" placeholder="例如：霓虹街角的約定"><label for="idea">故事概念／歌曲意境</label><textarea id="idea" placeholder="描述故事、情緒、人物與畫面風格"></textarea><div class="grid"><div><label for="style">視覺風格</label><select id="style"><option>電影寫實</option><option>老上海復古</option><option>浪漫唯美</option><option>動畫風格</option><option>自訂</option></select></div><div><label for="ratio">影片比例</label><select id="ratio"><option>9:16 Shorts</option><option>16:9 橫式</option><option>1:1 方形</option></select></div></div><label for="lyrics">歌詞／旁白（可選）</label><textarea id="lyrics" placeholder="貼上歌詞或旁白"></textarea><div class="actions"><button id="save">儲存作品</button><button class="secondary" id="export">匯出 JSON 備份</button><button class="secondary" id="importBtn">匯入備份</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div><p id="status" role="status" class="muted"></p></section><section><h2>📝 劇本編輯</h2><label for="script">劇本內容</label><textarea id="script" style="min-height:190px" placeholder="在這裡編寫劇情、對白與場景描述"></textarea><div class="actions"><button class="secondary" id="outline">產生基本劇本架構</button></div><p class="muted">基本架構由本機範本產生，並非 AI 生成。</p></section><section><h2>👥 角色管理</h2><label for="character">角色名稱及外觀設定</label><textarea id="character" placeholder="例如：女主角，30歲，復古捲髮，米色旗袍"></textarea><div class="actions"><button id="addCharacter">新增角色</button></div><div id="characters"></div></section><section><h2>🎞️ 分鏡管理</h2><label for="shot">鏡頭描述</label><textarea id="shot" placeholder="例如：鏡頭緩緩推近咖啡館窗邊的女主角"></textarea><div class="grid"><div><label for="seconds">片段秒數</label><input id="seconds" type="number" min="1" max="120" value="5"></div><div><label for="camera">鏡頭運動</label><select id="camera"><option>固定鏡頭</option><option>緩慢推近</option><option>平移</option><option>跟拍</option><option>拉遠</option></select></div></div><div class="actions"><button id="addShot">新增分鏡</button></div><div id="shots"></div></section><section><h2>🚀 後續 AI 功能</h2><p>劇本 AI 生成、角色圖片、影片片段、配音、字幕及 MP4 自動剪輯，將在後續版本串接。這一版不會假裝已經產生影片。</p></section></main><footer>AI Film Studio · 第一版創作工作台</footer><script>
const $=id=>document.getElementById(id),fields=['mode','name','idea','style','ratio','lyrics','script'];let current=null,characters=[],shots=[];const key='ai-film-studio-projects-v1';function all(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}function persist(db){localStorage.setItem(key,JSON.stringify(db))}function status(s){$('status').textContent=s}function refresh(){const selected=current;$('projects').innerHTML='<option value="">選擇作品</option>';Object.entries(all()).forEach(([id,p])=>{let o=document.createElement('option');o.value=id;o.textContent=p.name||'未命名作品';$('projects').appendChild(o)});$('projects').value=selected||''}function read(){let p={characters,shots};fields.forEach(f=>p[f]=$(f).value);return p}function render(){const c=$('characters'),s=$('shots');c.replaceChildren();s.replaceChildren();characters.forEach((v,i)=>{const d=document.createElement('div');d.className='item';const t=document.createElement('div');t.textContent=v;const b=document.createElement('button');b.className='secondary';b.textContent='移除';b.onclick=()=>{characters.splice(i,1);render()};d.append(t,b);c.append(d)});shots.forEach((v,i)=>{const d=document.createElement('div');d.className='item';const t=document.createElement('div');t.textContent=`鏡頭 ${i+1}｜${v.seconds} 秒｜${v.camera}\n${v.text}`;const b=document.createElement('button');b.className='secondary';b.textContent='移除';b.onclick=()=>{shots.splice(i,1);render()};d.append(t,b);s.append(d)})}function load(id){const p=all()[id];if(!p)return;current=id;fields.forEach(f=>$(f).value=p[f]|| (f==='mode'?'短劇':f==='style'?'電影寫實':f==='ratio'?'9:16 Shorts':''));characters=Array.isArray(p.characters)?p.characters:[];shots=Array.isArray(p.shots)?p.shots:[];render();refresh();status('作品已開啟')}function reset(){current=null;fields.forEach(f=>$(f).value='');$('mode').value='短劇';$('style').value='電影寫實';$('ratio').value='9:16 Shorts';characters=[];shots=[];render();refresh();status('已建立空白作品')}function save(){try{const p=read();if(!p.name.trim()){status('請先填寫作品名稱');return}if(!current)current=String(Date.now());const db=all();db[current]=p;persist(db);refresh();status('已儲存至本機瀏覽器')}catch(e){status('儲存失敗：請檢查瀏覽器儲存空間')}}$('projects').onchange=e=>{if(e.target.value)load(e.target.value)};$('new').onclick=reset;$('save').onclick=save;$('delete').onclick=()=>{if(!current){status('尚未選擇已儲存作品');return}if(confirm('確定刪除目前作品？')){const db=all();delete db[current];persist(db);reset()}};$('addCharacter').onclick=()=>{const v=$('character').value.trim();if(!v)return;characters.push(v);$('character').value='';render()};$('addShot').onclick=()=>{const text=$('shot').value.trim(),seconds=Number($('seconds').value);if(!text||!Number.isFinite(seconds)||seconds<1||seconds>120){status('請輸入分鏡描述與 1–120 秒片長');return}shots.push({text,seconds,camera:$('camera').value});$('shot').value='';render()};$('outline').onclick=()=>{if($('script').value.trim()&&!confirm('要覆蓋目前劇本嗎？'))return;const idea=$('idea').value.trim()||'請補充故事概念';$('script').value=`作品：${$('name').value||'未命名'}\n主題：${idea}\n\n第一幕｜開場\n場景：\n人物：\n情節：\n對白：\n\n第二幕｜發展\n場景：\n人物：\n衝突：\n對白：\n\n第三幕｜結尾\n場景：\n人物：\n收束：`;status('已建立可編輯的劇本範本')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,project:read()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-film-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('已產生備份檔')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),p=obj.project;if(!p||typeof p!=='object'||!Array.isArray(p.shots)||!Array.isArray(p.characters))throw Error('格式不正確');reset();fields.forEach(k=>{if(typeof p[k]==='string')$(k).value=p[k]});characters=p.characters.filter(x=>typeof x==='string');shots=p.shots.filter(x=>x&&typeof x.text==='string'&&Number.isFinite(Number(x.seconds))).map(x=>({text:x.text,seconds:Number(x.seconds),camera:String(x.camera||'固定鏡頭')}));render();status('備份已匯入，請按「儲存作品」保存')}catch(err){status('匯入失敗：'+err.message)}e.target.value=''};refresh();
</script></body></html>
