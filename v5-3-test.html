<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Film Studio V5.3 免費配音測試</title><style>*{box-sizing:border-box}body{margin:0;background:#11101e;color:#f5f1ff;font:16px system-ui,-apple-system,'Noto Sans TC',sans-serif}main{max-width:780px;margin:auto;padding:24px 16px 70px}h1{color:#c9a7ff;font-size:29px}h2{font-size:21px}p,.hint{color:#c3bfd0;line-height:1.65}.panel{background:#252039;border:1px solid #52446d;border-radius:18px;padding:18px;margin:18px 0}label{display:block;margin:14px 0 6px;font-weight:650}input,select,textarea{width:100%;padding:12px;border:1px solid #74638e;border-radius:10px;background:#171426;color:white;font:inherit}textarea{min-height:85px;resize:vertical}button{border:0;border-radius:10px;padding:12px 15px;margin:6px 6px 6px 0;background:#ad8af9;color:#1b1232;font-weight:750;font-size:15px}button.secondary{background:#47405d;color:white}button:disabled{opacity:.45}small{color:#b8b0c8}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{padding:12px;border-radius:10px;background:#342b4b;margin-top:12px}.tag{color:#b9a0ed;font-size:14px}a{color:#d5b9ff}@media(max-width:480px){.row{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><main><h1>🎬 AI Film Studio V5.3</h1><p>免費中文角色配音試聽 · 分鏡字幕 · 配音時間表</p><div class="panel"><h2>作品設定</h2><label for="project">作品名稱</label><input id="project" value="霓虹舊夢"><div class="row"><div><label for="female">女主角聲音</label><select id="female"></select></div><div><label for="male">男主角聲音</label><select id="male"></select></div></div><label for="rate">語速 <span id="rateVal">0.90</span></label><input id="rate" type="range" min="0.65" max="1.2" step="0.05" value="0.9"><p class="hint">聲音取決於裝置與瀏覽器已安裝的語音。不同手機可能只有一種中文聲音，無法保證男、女聲都可選。</p><button id="refresh" class="secondary">重新載入可用聲音</button><button id="stop" class="secondary">停止播放</button><div id="status" class="status" role="status">準備就緒。請先按鏡頭的「試聽台詞」。</div></div><div id="shots"></div><div class="panel"><h2>匯出測試成果</h2><p>可下載 SRT 字幕、配音時間表及 JSON 設定。瀏覽器內建語音只能即時朗讀，這一版尚不能匯出 MP3/WAV，也不能自動修改影片嘴型。</p><button id="srt">下載 SRT 字幕</button><button id="cue">下載配音時間表</button><button id="json">下載作品 JSON</button><label for="import">匯入先前作品 JSON（選用）</label><input type="file" id="import" accept=".json,application/json"><small>支援含 shots 陣列的作品資料；原始影片不會上傳或匯入。所有資料在本機瀏覽器處理。</small></div></main><script>
const defaults=[{role:'曼菁',description:'重逢的咖啡館',text:'……文遠？',duration:5,delay:2,show:2},{role:'文遠',description:'久別重逢',text:'曼菁……真的是妳？',duration:5,delay:2,show:3},{role:'曼菁',description:'回憶浮現',text:'七年了……你還記得我。',duration:5,delay:2,show:3},{role:'文遠',description:'重逢的承諾',text:'這一次……我不會再錯過妳。',duration:5,delay:2,show:3}];let data=structuredClone(defaults),voices=[];const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;function add(tag,attrs={},parent){const el=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='text')el.textContent=v;else if(k==='className')el.className=v;else el.setAttribute(k,v)});if(parent)parent.append(el);return el}function field(parent,label,type,value,change){const l=add('label',{text:label},parent),el=add(type==='textarea'?'textarea':'input',type==='textarea'?{}:{type:type||'text'},parent);el.value=value;el.addEventListener('input',()=>change(el.value));return el}function render(){const root=$('shots');root.replaceChildren();data.forEach((s,i)=>{const p=add('section',{className:'panel'},root);add('h2',{text:'鏡頭 '+String(i+1).padStart(2,'0')},p);field(p,'分鏡描述','text',s.description,v=>s.description=v);field(p,'說話角色','text',s.role,v=>s.role=v);field(p,'台詞','textarea',s.text,v=>s.text=v);const r=add('div',{className:'row'},p);const a=add('div',{},r),b=add('div',{},r);field(a,'鏡頭秒數','number',s.duration,v=>s.duration=Math.max(0,Number(v)||0));field(b,'字幕延遲（秒）','number',s.delay,v=>s.delay=Math.max(0,Number(v)||0));field(p,'字幕顯示秒數','number',s.show,v=>s.show=Math.max(0,Number(v)||0));const btn=add('button',{text:'▶ 試聽台詞'},p);btn.addEventListener('click',()=>speak(s));});}function loadVoices(){if(!('speechSynthesis'in window)){status('此瀏覽器不支援內建語音朗讀。');return;}voices=speechSynthesis.getVoices();const chinese=voices.filter(v=>/zh|cmn|Chinese|中文|國語|普通話/i.test(v.lang+' '+v.name));for(const id of ['female','male']){const select=$(id),prev=select.value;select.replaceChildren();add('option',{value:'',text:'裝置預設中文聲音'},select);chinese.forEach(v=>add('option',{value:v.voiceURI,text:v.name+' ('+v.lang+')'},select));if([...select.options].some(o=>o.value===prev))select.value=prev;}status(chinese.length?`找到 ${chinese.length} 個中文語音選項，可開始試聽。`:'尚未找到中文語音清單；可先試聽裝置預設聲音。');}function speak(s){if(!('speechSynthesis'in window)){status('目前瀏覽器不支援語音朗讀。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.text||'');u.lang='zh-TW';u.rate=Number($('rate').value);const id=(/曼菁|女/.test(s.role)?$('female'):$('male')).value;const v=voices.find(x=>x.voiceURI===id);if(v)u.voice=v;u.onstart=()=>status('正在試聽：'+s.role+' — '+s.text);u.onend=()=>status('試聽結束。');u.onerror=e=>status('朗讀未完成：'+e.error+'。可嘗試重新載入聲音或改用 Safari。');speechSynthesis.speak(u)}function stamp(t){let ms=Math.round(Math.max(0,t)*1000),h=Math.floor(ms/3600000);ms%=3600000;let m=Math.floor(ms/60000);ms%=60000;let s=Math.floor(ms/1000);ms%=1000;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')+','+String(ms).padStart(3,'0')}function cues(){let t=0;return data.map((s,i)=>{const start=t+Math.min(s.duration,s.delay),end=Math.min(t+s.duration,start+s.show);const r={index:i+1,role:s.role,description:s.description,text:s.text,start,end,duration:s.duration};t+=s.duration;return r})}function download(name,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\ufeff',content],{type}));const a=add('a',{href:url,download:name},document.body);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status('已要求瀏覽器下載：'+name)}function filename(){return ($('project').value.trim()||'作品').replace(/[\\/:*?"<>|]/g,'_')}function srt(){return cues().filter(c=>c.end>c.start&&c.text.trim()).map((c,i)=>`${i+1}\n${stamp(c.start)} --> ${stamp(c.end)}\n${c.text}\n`).join('\n')}function voiceSheet(){return '鏡頭\t角色\t開始秒數\t結束秒數\t台詞\n'+cues().map(c=>[c.index,c.role,c.start,c.end,c.text.replace(/[\t\n]/g,' ')].join('\t')).join('\n')}$('rate').oninput=()=>$('rateVal').textContent=Number($('rate').value).toFixed(2);$('refresh').onclick=loadVoices;$('stop').onclick=()=>{speechSynthesis.cancel();status('已停止播放。')};$('srt').onclick=()=>download(filename()+'.srt',srt());$('cue').onclick=()=>download(filename()+'_配音時間表.tsv',voiceSheet(),'text/tab-separated-values;charset=utf-8');$('json').onclick=()=>download(filename()+'_V5.3.json',JSON.stringify({version:'5.3',title:$('project').value,shots:data},null,2),'application/json');$('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());const arr=Array.isArray(obj)?obj:obj.shots;if(!Array.isArray(arr)||!arr.length)throw Error('找不到 shots 分鏡陣列');data=arr.map((x,i)=>({role:String(x.role??x.speaker??defaults[i%4].role),description:String(x.description??x.prompt??''),text:String(x.text??x.caption??x.dialogue??''),duration:Number(x.duration??x.seconds??5)||5,delay:Number(x.delay??x.captionDelay??2)||0,show:Number(x.show??x.captionDuration??3)||0}));if(obj.title||obj.name)$('project').value=obj.title||obj.name;render();status('已匯入 '+data.length+' 個分鏡；請確認台詞和秒數。')}catch(err){status('匯入失敗：'+err.message)}};render();loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;
</script></body></html>
