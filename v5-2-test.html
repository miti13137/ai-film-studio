<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Film Studio V5.2</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#110f1d;color:#f6f2ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:850px;margin:auto}h1{color:#d0b3ff}section{background:#252039;border:1px solid #51446b;border-radius:16px;padding:18px;margin:16px 0}.shot{padding:14px 0;border-top:1px solid #55476d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;margin:12px 0 4px}input,textarea{width:100%;padding:11px;background:#151224;color:white;border:1px solid #6b5a87;border-radius:9px;font:inherit}textarea{min-height:68px}button{border:0;border-radius:10px;background:#ad8cff;color:#171026;font-weight:700;padding:12px 15px;margin:8px 8px 5px 0;cursor:pointer}.secondary{background:#443858;color:white}small,.muted{color:#cfc4dc}#status{white-space:pre-wrap}a{color:#d0b3ff}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main>
<h1>🎬 AI Film Studio V5.2</h1><p>分鏡影片・角色配音・背景音樂・CapCut Windows 素材包</p>
<section><label for="title">作品名稱</label><input id="title" value="霓虹舊夢"><label for="import">匯入 V5.1 分鏡計畫 JSON（可選）</label><input id="import" type="file" accept=".json,application/json"><p><small>影片、音樂及配音只在瀏覽器內處理，不會上傳伺服器。請在下載前保持網頁開啟。</small></p><button class="secondary" id="add">＋新增鏡頭</button><button class="secondary" id="reset">還原示範分鏡</button></section>
<section><h2>分鏡影片與字幕</h2><div id="shots"></div></section>
<section><h2>配音與音樂</h2><label for="voice">配音音檔（可多選，依檔名整理）</label><input id="voice" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac" multiple><label for="music">背景音樂</label><input id="music" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac"><p class="muted"><small>配音與音樂會收進 ZIP，但不會自動對齊、混音或消除原影片聲音。配音清單可用來人工對位。</small></p></section>
<section><h2>下載 CapCut 素材包</h2><button id="pack">下載 ZIP 素材包</button><button class="secondary" id="srt">單獨下載 SRT</button><button class="secondary" id="plan">下載分鏡計畫 JSON</button><p id="status" role="status"></p><p class="muted"><small>ZIP 內含影片、配音、背景音樂、字幕 SRT、配音 CSV、分鏡 JSON 與操作說明。CapCut Windows 需自行匯入及排入時間軸；這不是 CapCut 原生工程檔。大型影片打包可能消耗較多手機記憶體，建議必要時改用電腦。</small></p></section></main><script>
'use strict';const $=id=>document.getElementById(id);
const sample=()=>[{seconds:5,text:'重逢的咖啡館',caption:'……文遠？',speaker:'曼菁',offset:2,captionSeconds:2},{seconds:5,text:'男子回頭',caption:'曼菁……真的是妳？',speaker:'文遠',offset:1,captionSeconds:3},{seconds:5,text:'七年後重逢',caption:'七年了……你還記得我。',speaker:'曼菁',offset:1,captionSeconds:3},{seconds:5,text:'重逢的約定',caption:'這一次……我不會再錯過妳。',speaker:'文遠',offset:1,captionSeconds:3}];
let shots=sample(),videos=[];
const num=(x,d)=>Number.isFinite(Number(x))&&Number(x)>0?Number(x):d,zero=(x,d)=>Number.isFinite(Number(x))&&Number(x)>=0?Number(x):d;
const safe=s=>String(s||'file').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,90);
function field(label,value,cb,type='text'){const w=document.createElement('label');w.textContent=label;const e=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea'){e.type=type;if(type==='number'){e.step='0.1';e.min='0'}}e.value=value;e.oninput=()=>cb(e.value);w.append(e);return w}
function draw(){const root=$('shots');root.replaceChildren();shots.forEach((s,i)=>{const b=document.createElement('div');b.className='shot';const h=document.createElement('h3');h.textContent='鏡頭 '+String(i+1).padStart(2,'0');b.append(h);const g=document.createElement('div');g.className='grid';g.append(field('鏡頭秒數',s.seconds,v=>s.seconds=v,'number'),field('說話角色',s.speaker||'',v=>s.speaker=v));b.append(g,field('分鏡描述',s.text||'',v=>s.text=v,'textarea'),field('字幕／台詞',s.caption||'',v=>s.caption=v,'textarea'));const t=document.createElement('div');t.className='grid';t.append(field('字幕延遲秒數',s.offset??0,v=>s.offset=v,'number'),field('字幕顯示秒數',s.captionSeconds??3,v=>s.captionSeconds=v,'number'));b.append(t);const l=document.createElement('label');l.textContent='本鏡頭影片（MP4 / MOV / WebM）';const f=document.createElement('input');f.type='file';f.accept='video/*,.mp4,.mov,.webm';f.onchange=()=>{videos[i]=f.files?.[0]||null};l.append(f);b.append(l);const del=document.createElement('button');del.className='secondary';del.textContent='刪除此鏡頭';del.onclick=()=>{shots.splice(i,1);videos.splice(i,1);draw()};b.append(del);root.append(b)})}
function rows(){let at=0;return shots.map((s,i)=>{const seconds=num(s.seconds,5),offset=Math.min(zero(s.offset,0),seconds),duration=Math.min(num(s.captionSeconds,seconds),seconds-offset);const r={number:i+1,shotStart:at,seconds,start:at+offset,end:at+offset+duration,caption:String(s.caption||'').trim(),speaker:String(s.speaker||'').trim(),description:String(s.text||'')};at+=seconds;return r})}
const pad=n=>String(n).padStart(2,'0');
function stamp(t){const n=Math.round(t*1000);return pad(Math.floor(n/3600000))+':'+pad(Math.floor(n/60000)%60)+':'+pad(Math.floor(n/1000)%60)+','+String(n%1000).padStart(3,'0')}
function srt(){return rows().filter(r=>r.caption&&r.end>r.start).map((r,i)=>(i+1)+'\n'+stamp(r.start)+' --> '+stamp(r.end)+'\n'+r.caption).join('\n\n')+'\n'}
const csvcell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function voiceCsv(){return [['鏡頭','角色','開始秒數','結束秒數','台詞'],...rows().filter(r=>r.caption).map(r=>[r.number,r.speaker,r.start.toFixed(3),r.end.toFixed(3),r.caption])].map(r=>r.map(csvcell).join(',')).join('\r\n')}
function plan(){return JSON.stringify({name:$('title').value,shots:shots.map(s=>({...s}))},null,2)}
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
const encoder=new TextEncoder();function utf(s){return encoder.encode(s)}function u16(v,n,x){v.setUint16(n,x,true)}function u32(v,n,x){v.setUint32(n,x>>>0,true)}
const crcTable=(()=>{const a=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;a[n]=c>>>0}return a})();
function crc32(b){let c=0xffffffff;for(const x of b)c=crcTable[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0}
async function zip(files){const parts=[],central=[];let offset=0;for(const f of files){const name=utf(f.name),data=f.blob instanceof Blob?new Uint8Array(await f.blob.arrayBuffer()):utf(f.text||'');if(data.length>0xffffffff||offset+data.length>0xffffffff)throw Error('素材過大，請改用電腦分批處理');const crc=crc32(data),h=new Uint8Array(30+name.length),v=new DataView(h.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x800);u16(v,8,0);u32(v,14,crc);u32(v,18,data.length);u32(v,22,data.length);u16(v,26,name.length);h.set(name,30);parts.push(h,data);const c=new Uint8Array(46+name.length),w=new DataView(c.buffer);u32(w,0,0x02014b50);u16(w,4,20);u16(w,6,20);u16(w,8,0x800);u32(w,16,crc);u32(w,20,data.length);u32(w,24,data.length);u16(w,28,name.length);u32(w,42,offset);c.set(name,46);central.push(c);offset+=h.length+data.length}const start=offset;for(const c of central){parts.push(c);offset+=c.length}const end=new Uint8Array(22),v=new DataView(end.buffer);u32(v,0,0x06054b50);u16(v,8,files.length);u16(v,10,files.length);u32(v,12,offset-start);u32(v,16,start);parts.push(end);return new Blob(parts,{type:'application/zip'})}
$('add').onclick=()=>{shots.push({seconds:5,text:'',caption:'',speaker:'',offset:0,captionSeconds:3});videos.push(null);draw()};
$('reset').onclick=()=>{shots=sample();videos=[];draw()};
$('import').onchange=async e=>{try{const file=e.target.files?.[0];if(!file)return;const data=JSON.parse(await file.text()),project=Array.isArray(data)?{shots:data}:data.shots?data:data.project?.shots?data.project:null;if(!project||!Array.isArray(project.shots))throw Error('找不到 shots 陣列');shots=project.shots.map(s=>({seconds:num(s.seconds??s.duration,5),text:String(s.text??s.description??''),caption:String(s.caption??s.dialogue??s.subtitle??''),speaker:String(s.speaker??''),offset:zero(s.offset,0),captionSeconds:num(s.captionSeconds,3)}));videos=[];if(project.name||project.title)$('title').value=project.name||project.title;draw();$('status').textContent='已匯入 '+shots.length+' 個鏡頭，請重新選擇影片檔案'}catch(err){$('status').textContent='匯入失敗：'+err.message}finally{e.target.value=''}};
$('srt').onclick=()=>{download(safe($('title').value)+'.srt',new Blob(['\ufeff',srt()],{type:'text/plain;charset=utf-8'}));$('status').textContent='SRT 字幕已下載'};
$('plan').onclick=()=>{download(safe($('title').value)+'_分鏡計畫.json',new Blob([plan()],{type:'application/json'}));$('status').textContent='分鏡計畫已下載'};
$('pack').onclick=async()=>{const btn=$('pack');btn.disabled=true;$('status').textContent='正在整理素材，請保持頁面開啟……';try{const files=[{name:'subtitles/'+safe($('title').value)+'.srt',text:'\ufeff'+srt()},{name:'voice/配音清單.csv',text:'\ufeff'+voiceCsv()},{name:'storyboard.json',text:plan()},{name:'README.txt',text:'AI Film Studio V5.2 CapCut Windows 素材包\n1. 解壓 ZIP。\n2. 將 video/ 影片依 shot_01、shot_02 順序匯入 CapCut 時間軸。\n3. 匯入 subtitles/ 的 SRT 字幕，確認字幕時間與影片實際長度一致。\n4. voice/ 配音檔與 music/ 背景音樂須自行匯入及對位。\n5. 影片原聲（含浮水印）不會被此工具修改。\n6. 這不是 CapCut 原生工程檔。\n'}];for(let i=0;i<videos.length;i++){const f=videos[i];if(f)files.push({name:'video/shot_'+pad(i+1)+'.'+(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,''),blob:f})}for(const [i,f] of Array.from($('voice').files).entries())files.push({name:'voice/voice_'+pad(i+1)+'_'+safe(f.name),blob:f});const music=$('music').files?.[0];if(music)files.push({name:'music/'+safe(music.name),blob:music});const blob=await zip(files);download(safe($('title').value)+'_CapCut素材包.zip',blob);$('status').textContent='完成：'+files.length+' 個檔案，ZIP 約 '+(blob.size/1048576).toFixed(1)+' MB。請在下載項目確認。'}catch(err){$('status').textContent='打包失敗：'+err.message}finally{btn.disabled=false}};
draw();
</script></body></html>
