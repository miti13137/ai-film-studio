<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Film Studio V5.1</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f5f2ff;background:#100f1d}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:800px;margin:auto}h1{color:#d2b6ff}section{background:#242039;border:1px solid #504569;border-radius:16px;padding:18px;margin:16px 0}label{display:block;margin:10px 0 5px;font-weight:600}input,textarea,select{width:100%;border:1px solid #675b82;background:#171429;color:white;padding:11px;border-radius:9px;font:inherit}textarea{min-height:70px}button{background:#a78bfa;color:#160e27;border:0;border-radius:9px;padding:11px 14px;margin:6px 6px 6px 0;font-weight:700;cursor:pointer}.secondary{background:#403554;color:white}.shot{border-top:1px solid #504569;padding:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}small,.muted{color:#c9bfd9}#status{white-space:pre-wrap}a{color:#d2b6ff}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main>
<h1>🎬 AI Film Studio V5.1</h1><p>分鏡時間編輯・CapCut SRT 字幕・配音清單</p>
<section><label for="title">作品名稱</label><input id="title" value="霓虹舊夢">
<label for="jsonFile">匯入 AI-Film-Studio 作品 JSON（可選）</label><input type="file" id="jsonFile" accept=".json,application/json">
<p class="muted"><small>支援主程式匯出的作品 JSON 或包含 shots 陣列的分鏡 JSON。匯入只讀取本機檔案，不會上傳伺服器。</small></p>
<button id="add" class="secondary">＋新增鏡頭</button><button id="sample" class="secondary">還原示範分鏡</button></section>
<section><h2>分鏡與對白</h2><div id="shots"></div></section>
<section><h2>輸出剪輯資料</h2><button id="srt">下載 SRT 字幕</button><button id="voice">下載配音清單 CSV</button><button id="plan">下載分鏡計畫 JSON</button><p id="status" role="status" class="muted"></p><p class="muted"><small>字幕時間依每鏡頭秒數累加；可設定字幕延遲與顯示秒數。這一版產生可匯入的文字素材，不會自動合成語音或操作 CapCut。</small></p></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let shots=[];
const sample=()=>[{seconds:5,text:'重逢的咖啡館',caption:'……文遠？',speaker:'曼菁',offset:2,captionSeconds:2},{seconds:5,text:'男子回頭',caption:'曼菁……真的是妳？',speaker:'陳文遠',offset:1,captionSeconds:3},{seconds:5,text:'七年後重逢',caption:'七年了……你還記得我。',speaker:'曼菁',offset:1,captionSeconds:3},{seconds:5,text:'重逢的約定',caption:'這一次……我不會再錯過妳。',speaker:'陳文遠',offset:1,captionSeconds:3}];
function positive(n,fallback){const v=Number(n);return Number.isFinite(v)&&v>0?v:fallback}
function nonneg(n,fallback){const v=Number(n);return Number.isFinite(v)&&v>=0?v:fallback}
function field(label,value,onchange,type='text'){const wrap=document.createElement('label');wrap.textContent=label;const e=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')e.type=type;e.value=value;e.addEventListener('input',()=>onchange(e.value));wrap.append(e);return wrap}
function draw(){const root=$('shots');root.replaceChildren();shots.forEach((s,i)=>{const box=document.createElement('div');box.className='shot';const h=document.createElement('h3');h.textContent='鏡頭 '+String(i+1).padStart(2,'0');box.append(h);const g=document.createElement('div');g.className='grid';g.append(field('鏡頭秒數',s.seconds,v=>s.seconds=v,'number'),field('說話角色',s.speaker||'',v=>s.speaker=v));box.append(g);box.append(field('分鏡描述',s.text||'',v=>s.text=v,'textarea'));box.append(field('字幕／台詞',s.caption||'',v=>s.caption=v,'textarea'));const t=document.createElement('div');t.className='grid';t.append(field('字幕延遲（秒）',s.offset??0,v=>s.offset=v,'number'),field('字幕顯示秒數',s.captionSeconds??3,v=>s.captionSeconds=v,'number'));box.append(t);const del=document.createElement('button');del.className='secondary';del.textContent='刪除此鏡頭';del.onclick=()=>{shots.splice(i,1);draw()};box.append(del);root.append(box)})}
function stamp(sec){const ms=Math.round(sec*1000),p=n=>String(n).padStart(2,'0');return p(Math.floor(ms/3600000))+':'+p(Math.floor(ms/60000)%60)+':'+p(Math.floor(ms/1000)%60)+','+String(ms%1000).padStart(3,'0')}
function rows(){let elapsed=0;return shots.map((s,i)=>{const duration=positive(s.seconds,5),offset=Math.min(nonneg(s.offset,0),duration),display=Math.min(positive(s.captionSeconds,duration),duration-offset);const row={number:i+1,start:elapsed+offset,end:elapsed+offset+display,shotStart:elapsed,seconds:duration,caption:String(s.caption||'').trim(),speaker:String(s.speaker||'').trim(),text:String(s.text||'').trim()};elapsed+=duration;return row})}
function download(name,content,mime){const blob=new Blob(['\uFEFF',content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function filename(ext){return ($('title').value.trim()||'AI-Film-Studio').replace(/[\\/:*?"<>|]/g,'_')+ext}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
$('srt').onclick=()=>{const valid=rows().filter(r=>r.caption&&r.end>r.start);if(!valid.length){$('status').textContent='請至少填入一段字幕';return}download(filename('.srt'),valid.map((r,i)=>[i+1,stamp(r.start)+' --> '+stamp(r.end),r.caption].join('\n')).join('\n\n')+'\n','text/plain;charset=utf-8');$('status').textContent='已產生 '+valid.length+' 段 SRT 字幕'};
$('voice').onclick=()=>{const data=rows().filter(r=>r.caption);const table=[['鏡頭','角色','開始秒數','結束秒數','台詞'],...data.map(r=>[r.number,r.speaker,r.start.toFixed(3),r.end.toFixed(3),r.caption])];download(filename('_配音清單.csv'),table.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('status').textContent='已下載配音清單（尚未生成語音）'};
$('plan').onclick=()=>{download(filename('_分鏡計畫.json'),JSON.stringify({name:$('title').value,shots:shots.map(s=>({...s}))},null,2),'application/json;charset=utf-8');$('status').textContent='已下載分鏡計畫 JSON'};
$('add').onclick=()=>{shots.push({seconds:5,text:'',caption:'',speaker:'',offset:0,captionSeconds:3});draw()};
$('sample').onclick=()=>{shots=sample();$('title').value='霓虹舊夢';draw()};
$('jsonFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());let project=data;if(Array.isArray(data))project={shots:data};if(!Array.isArray(project.shots)&&data.project&&Array.isArray(data.project.shots))project=data.project;if(!Array.isArray(project.shots)&&data.data&&Array.isArray(data.data.shots))project=data.data;if(!Array.isArray(project.shots))throw Error('找不到 shots 分鏡陣列');shots=project.shots.map(s=>({seconds:positive(s.seconds??s.duration,5),text:String(s.text??s.description??''),caption:String(s.caption??s.dialogue??s.subtitle??''),speaker:String(s.speaker??''),offset:nonneg(s.offset,0),captionSeconds:positive(s.captionSeconds,3)}));if(project.name||project.title)$('title').value=project.name||project.title;draw();$('status').textContent='已匯入 '+shots.length+' 個鏡頭；請檢查字幕與時間'}catch(err){$('status').textContent='匯入失敗：'+err.message}finally{e.target.value=''}};
shots=sample();draw();
</script></body></html>
