<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Film Studio V4</title><style>
*{box-sizing:border-box}body{margin:0;background:#100f1c;color:#f4f0ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:28px}section,article{background:#211d33;border:1px solid #50456b;border-radius:18px;padding:20px;margin:18px 0}button,.btn{border:0;border-radius:12px;background:#9879ef;color:#171125;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.5}input,textarea{width:100%;border:1px solid #766a91;background:#151323;color:white;border-radius:10px;padding:12px;margin:8px 0;font-size:15px}textarea{min-height:110px}label{display:block;margin-top:12px}small,p{line-height:1.6;color:#c8c1d9}.preview{aspect-ratio:9/16;max-width:300px;background:#141123;border:1px dashed #6e6187;border-radius:12px;display:grid;place-items:center;overflow:hidden;margin:14px auto}.preview img{width:100%;height:100%;object-fit:cover}a{color:#c8b4ff}.row{display:flex;gap:10px;flex-wrap:wrap}.status{color:#b8f1c7}</style></head><body><main><h1>🎬 AI Film Studio V4.0</h1><p>分鏡匯入、提示詞編輯與圖片預覽測試版。保留原 V3.1。</p><section><h2>① 匯入分鏡 JSON</h2><input id="file" type="file" accept=".json,application/json"><p id="state">請選擇 V3.1 下載的分鏡 JSON。</p></section><section><h2>② 圖片生成設定</h2><p>目前 GitHub Pages 是靜態網站。真正的 AI 生圖必須先部署安全的後端服務；請勿把 API 金鑰貼進這個網頁或 GitHub。</p><label>安全圖片 API 端點（HTTPS）<input id="endpoint" type="url" placeholder="https://your-backend.example.com/generate-image"></label><small>後端需接受 POST JSON {prompt,aspectRatio,shotNumber}，並回傳 {imageUrl} 或 {imageBase64,mimeType}；也需設定 CORS。</small></section><div id="shots"></div></main><script>
const file=document.getElementById('file'),state=document.getElementById('state'),shots=document.getElementById('shots');let data=[];
file.addEventListener('change',async()=>{try{const parsed=JSON.parse(await file.files[0].text());const arr=Array.isArray(parsed)?parsed:Array.isArray(parsed.shots)?parsed.shots:null;if(!arr||!arr.length)throw Error('找不到分鏡陣列');data=arr;render();state.textContent='✅ 已匯入 '+arr.length+' 個分鏡';}catch(e){state.textContent='❌ 匯入失敗：'+e.message;}});
function render(){shots.replaceChildren();data.forEach((shot,i)=>{const article=document.createElement('article');const h=document.createElement('h2');h.textContent='鏡頭 '+(shot.number??i+1)+'｜'+(shot.seconds??'?')+' 秒';article.append(h);const p=document.createElement('p');p.textContent=shot.visual||'';article.append(p);const label=document.createElement('label');label.textContent='英文圖片提示詞';const t=document.createElement('textarea');t.value=shot.prompt||'';label.append(t);article.append(label);const box=document.createElement('div');box.className='preview';box.textContent='尚未生成圖片';article.append(box);const status=document.createElement('p');article.append(status);const row=document.createElement('div');row.className='row';const copy=document.createElement('button');copy.textContent='複製提示詞';copy.onclick=async()=>{try{await navigator.clipboard.writeText(t.value);status.textContent='已複製提示詞'}catch{t.select();status.textContent='請手動複製選取文字'}};const generate=document.createElement('button');generate.textContent='✨ 生成圖片';generate.onclick=async()=>{const endpoint=document.getElementById('endpoint').value.trim();if(!/^https:\/\//i.test(endpoint)){status.textContent='請先填寫安全 HTTPS 圖片 API 端點';return;}generate.disabled=true;status.textContent='圖片生成中…';try{const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:t.value,aspectRatio:'9:16',shotNumber:shot.number??i+1})});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();let url=json.imageUrl;if(!url&&json.imageBase64)url='data:'+(json.mimeType||'image/png')+';base64,'+json.imageBase64;if(!url)throw Error('回應缺少 imageUrl 或 imageBase64');const img=document.createElement('img');img.alt='鏡頭圖片';img.src=url;box.replaceChildren(img);status.textContent='✅ 圖片已產生';const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='開啟圖片';row.append(a);}catch(e){status.textContent='❌ '+e.message+'（請確認後端、金鑰及 CORS）'}finally{generate.disabled=false}};row.append(copy,generate);article.append(row);shots.append(article)})}
</script></body></html>
