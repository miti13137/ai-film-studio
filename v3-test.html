<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Film Studio V3.1</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100f1c;color:#f4f0ff;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 60px}h1{font-size:29px;margin:0}h2{font-size:24px;margin:0 0 16px}p{color:#c7c0db}section{background:#211d32;border:1px solid #4a4166;border-radius:20px;padding:22px;margin:20px 0}label{display:block;margin:12px 0 6px;font-weight:600}input,textarea,select{width:100%;background:#151222;border:1px solid #665b83;border-radius:12px;padding:13px;color:#fff;font:inherit}textarea{min-height:140px;resize:vertical}#script{min-height:330px}button{border:0;border-radius:13px;padding:13px 20px;background:#987bec;color:#171125;font:700 17px inherit;cursor:pointer;margin-top:14px}button:disabled{opacity:.45;cursor:wait}button.secondary{background:#594b8b;color:#fff}small{color:#c5bed6;display:block;margin-top:8px}.shot{border:1px solid #605477;border-radius:12px;padding:15px;margin:14px 0;background:#171426}.shot h3{margin:0 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:6px 0}#status{white-space:pre-wrap;overflow-wrap:anywhere}#status.error{color:#ff9e9e}#status.ok{color:#a6e6c0}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}#retryInfo{font-size:14px;color:#e2c9ff}
</style></head><body><main><h1>🎬 AI Film Studio V3.1</h1><p>Gemini AI 劇本與分鏡生成｜自動重試・備援模型・保留內容</p>
<section><h2>⚙️ API 設定</h2><label for="key">Gemini API Key</label><input id="key" type="password" autocomplete="off" placeholder="貼上 Gemini API Key"><small>僅在此頁面使用，不寫入程式碼或瀏覽器儲存空間。GitHub Pages 是公開靜態網站，請勿將金鑰提交到 GitHub；瀏覽器直連 API 仍有金鑰暴露風險，正式上線應改用後端代理。</small><label for="model">主要模型名稱</label><input id="model" value="gemini-3.5-flash-lite" spellcheck="false"><label for="fallback">備援模型名稱（以你的 API 帳號可用模型為準）</label><input id="fallback" value="gemini-2.5-flash" spellcheck="false"><small>若主要模型不存在或無權限，系統會嘗試備援模型；不保證所有帳號均可使用。</small></section>
<section><h2>✨ 創作設定</h2><label for="idea">故事概念</label><textarea id="idea">1930年代上海，一對多年未見的戀人在爵士舞廳意外重逢，彼此都藏著一封未寄出的信。</textarea><label for="style">影像風格</label><select id="style"><option>1930年代上海電影寫實</option><option>復古浪漫電影</option><option>現代電影寫實</option><option>動畫電影</option></select><button id="makeScript">✨ AI 生成劇本</button></section>
<section><h2>📝 劇本</h2><textarea id="script" placeholder="AI 生成的劇本會顯示在這裡，也可自行修改"></textarea><button id="makeShots">🎞️ AI 生成分鏡</button></section>
<section><h2>🎥 分鏡表</h2><div id="shots">尚未生成分鏡。</div><button id="export" class="secondary" disabled>下載分鏡 JSON</button></section>
<p id="retryInfo" aria-live="polite"></p><p id="status" role="status" aria-live="polite"></p>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let shotData=[];let running=false;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function status(s,kind=''){const el=$('status');el.textContent=s;el.className=kind}
function busy(on){running=on;$('makeScript').disabled=on;$('makeShots').disabled=on}
function errorMessage(e){return e instanceof Error?e.message:String(e)}
function modelList(){const list=[$('model').value.trim(),$('fallback').value.trim()].filter(Boolean);if(!list.every(x=>/^gemini-[a-z0-9.-]+$/i.test(x)))throw Error('模型名稱格式不正確');return [...new Set(list)]}
function parseApiError(data,response){const message=data?.error?.message||`HTTP ${response.status}`;const err=new Error(message);err.httpStatus=response.status;return err}
function retryable(e){return [429,500,502,503,504].includes(e.httpStatus)||e.name==='TypeError'||e.name==='AbortError'}
async function requestOne(model,prompt,json){const key=$('key').value.trim();if(!key)throw Error('請先輸入 Gemini API Key');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);try{const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:8192,...(json?{responseMimeType:'application/json'}:{})}};const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:controller.signal});let data;try{data=await response.json()}catch{throw Error('API 回傳不是有效 JSON（HTTP '+response.status+'）')}if(!response.ok)throw parseApiError(data,response);const parts=data?.candidates?.[0]?.content?.parts||[];const result=parts.map(x=>x.text||'').join('').trim();if(!result)throw Error('模型沒有回傳文字，請調整提示詞或模型');return result}finally{clearTimeout(timer)}}
async function gemini(prompt,json=false){const models=modelList();let last;for(let mi=0;mi<models.length;mi++){const model=models[mi];for(let attempt=0;attempt<3;attempt++){try{$('retryInfo').textContent=`使用模型：${model}（第 ${attempt+1} 次）`;return await requestOne(model,prompt,json)}catch(e){last=e;const transient=retryable(e);if(!transient||attempt===2)break;const delay=1500*Math.pow(2,attempt)+Math.floor(Math.random()*700);$('retryInfo').textContent=`${model} 暫時失敗，${Math.ceil(delay/1000)} 秒後重試（${attempt+2}/3）…`;await wait(delay)}}if(mi<models.length-1)$('retryInfo').textContent=`主要模型無法完成，改用備援模型：${models[mi+1]}`;}throw last||Error('沒有可用模型')}
function normalizeShots(raw){let data=JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim());if(!Array.isArray(data))data=data.shots||data.storyboard;if(!Array.isArray(data)||!data.length)throw Error('AI 回傳的分鏡不是有效陣列');return data.map((s,i)=>({number:Number(s.number)||i+1,seconds:Math.max(1,Math.min(60,Number(s.seconds)||5)),visual:String(s.visual||''),camera:String(s.camera||''),dialogue:String(s.dialogue||''),prompt:String(s.prompt||'')}))}
function renderShots(){const root=$('shots');root.replaceChildren();shotData.forEach((s,i)=>{const box=document.createElement('div');box.className='shot';const title=document.createElement('h3');title.textContent=`鏡頭 ${s.number||i+1}｜${s.seconds} 秒`;box.append(title);for(const [label,value] of [['畫面',s.visual],['運鏡',s.camera],['對白／旁白',s.dialogue],['英文影像提示詞',s.prompt]]){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+'：';p.append(strong,document.createTextNode(value||'—'));box.append(p)}root.append(box)});$('export').disabled=!shotData.length}
$('makeScript').onclick=async()=>{if(running)return;const idea=$('idea').value.trim();if(!idea)return status('請先輸入故事概念','error');busy(true);status('正在生成劇本…');try{const prompt=`你是專業繁體中文電影編劇。根據以下概念，寫一部約60秒、適合9:16直式短片的完整可拍攝短劇。包含片名、人物設定、場次、每段秒數、畫面、動作、自然對白與結尾。影像風格：${$('style').value}。故事概念：${idea}。只輸出繁體中文劇本。`;$('script').value=await gemini(prompt);status('✅ 劇本生成成功，可修改後繼續生成分鏡','ok')}catch(e){status('❌ 劇本生成失敗：'+errorMessage(e),'error')}finally{busy(false)}};
$('makeShots').onclick=async()=>{if(running)return;const script=$('script').value.trim();if(!script)return status('請先生成或輸入劇本','error');busy(true);status('正在生成分鏡…');try{const prompt=`你是專業電影分鏡導演。根據劇本製作6至10個可拍攝的鏡頭，總長約60秒，9:16直式構圖。風格：${$('style').value}。嚴格輸出JSON陣列，不要Markdown或額外文字。每個物件必須有 number(整數),seconds(整數),visual(繁體中文詳細畫面),camera(繁體中文運鏡),dialogue(繁體中文對白或旁白，沒有則空字串),prompt(英文詳細影像生成提示詞)。劇本：${script}`;const raw=await gemini(prompt,true);const parsed=normalizeShots(raw);shotData=parsed;renderShots();status(`✅ 成功生成 ${shotData.length} 個分鏡，可下載 JSON`,'ok')}catch(e){status('❌ 分鏡生成失敗：'+errorMessage(e)+'。原有劇本及已成功生成的分鏡均已保留。','error')}finally{busy(false)}};
$('export').onclick=()=>{if(!shotData.length)return;const blob=new Blob([JSON.stringify(shotData,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ai-film-studio-v3.1-shots.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
</script></body></html>
