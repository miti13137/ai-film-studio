<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Film Studio V3 測試</title>
<style>body{margin:0;background:#100f1c;color:#f5f2ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:22px}h1{font-size:27px}section{background:#211d32;border:1px solid #423a60;border-radius:18px;padding:18px;margin:18px 0}label{display:block;margin:14px 0 7px;font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;background:#141121;color:white;border:1px solid #615879;border-radius:10px;padding:13px;font:inherit}textarea{min-height:130px}button{border:0;border-radius:11px;padding:13px 17px;background:#9879f1;color:#151020;font-weight:700;font-size:16px;margin:12px 8px 5px 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}.shot{padding:12px;margin:10px 0;border:1px solid #5a5075;border-radius:12px}small{color:#c6bfd8}#status{min-height:26px;color:#d5c8ff}</style></head><body><main>
<h1>🎬 AI Film Studio V3</h1><p>Gemini AI 劇本與分鏡生成測試</p>
<section><label for="key">Gemini API Key（僅在此頁暫時使用，不儲存）</label><input id="key" type="password" autocomplete="off" placeholder="貼上你的 Gemini API Key"><small>這是公開的 GitHub Pages 靜態頁面。請勿把金鑰寫入 GitHub 程式碼或分享截圖中的金鑰。</small><label for="model">模型名稱</label><input id="model" value="gemini-2.5-flash" spellcheck="false"><label for="idea">故事概念</label><textarea id="idea">1930年代上海，一對多年未見的戀人在爵士舞廳意外重逢，彼此都藏著一封未寄出的信。</textarea><label for="style">影像風格</label><select id="style"><option>1930年代上海電影寫實</option><option>復古浪漫電影</option><option>現代電影寫實</option><option>動畫電影</option></select><button id="makeScript">✨ AI 生成劇本</button></section>
<section><h2>📝 劇本</h2><textarea id="script" placeholder="AI 生成的劇本會顯示在這裡，也可自行修改" style="min-height:260px"></textarea><button id="makeShots">🎞️ AI 生成分鏡</button></section>
<section><h2>🎥 分鏡表</h2><div id="shots">尚未生成分鏡。</div><button id="export" disabled>下載分鏡 JSON</button></section><p id="status" role="status" aria-live="polite"></p>
</main><script>
const $=id=>document.getElementById(id);let shotData=[];
function busy(v){$('makeScript').disabled=v;$('makeShots').disabled=v}
function status(s){$('status').textContent=s}
async function gemini(prompt,json=false){const key=$('key').value.trim(),model=$('model').value.trim();if(!key)throw Error('請先輸入 Gemini API Key');if(!/^gemini-[a-z0-9.-]+$/i.test(model))throw Error('模型名稱格式不正確');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);try{const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:json?{responseMimeType:'application/json'}:{}}),signal:controller.signal});const data=await response.json();if(!response.ok)throw Error(data.error?.message||'API 錯誤 '+response.status);const result=(data.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();if(!result)throw Error('模型沒有回傳文字，請調整內容或模型');return result}finally{clearTimeout(timer)}}
$('makeScript').onclick=async()=>{const idea=$('idea').value.trim();if(!idea)return status('請先輸入故事概念');busy(true);status('正在呼叫 Gemini 生成劇本…');try{const prompt=`你是專業繁體中文電影編劇。根據以下概念，寫一部約60秒、適合9:16直式短片的完整可拍攝短劇。包含片名、人物設定、場次、動作、自然對白、結尾。畫面風格：${$('style').value}。故事概念：${idea}。只輸出繁體中文劇本，不要解釋。`;$('script').value=await gemini(prompt);status('✅ 劇本生成成功，可修改後繼續生成分鏡')}catch(e){status('❌ '+(e.name==='AbortError'?'連線逾時，請稍後重試':e.message))}finally{busy(false)}};
$('makeShots').onclick=async()=>{const script=$('script').value.trim();if(!script)return status('請先生成或輸入劇本');busy(true);status('正在呼叫 Gemini 生成分鏡…');try{const prompt=`你是專業電影分鏡導演。根據以下劇本產生6到10個可拍攝鏡頭。風格：${$('style').value}。輸出嚴格 JSON 陣列，不能有任何額外文字，每項物件包含 number(整數序號),seconds(整數秒數),visual(繁體中文詳細畫面),camera(繁體中文運鏡),dialogue(繁體中文對白或旁白，無則空字串),prompt(可供影像生成的英文畫面提示)。每鏡頭約3至10秒。劇本：${script}`;let raw=await gemini(prompt,true);raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let data=JSON.parse(raw);if(!Array.isArray(data))data=data.shots||data.storyboard;if(!Array.isArray(data)||!data.length)throw Error('AI 回傳的分鏡格式不正確');shotData=data;$('shots').replaceChildren();data.forEach((s,i)=>{const box=document.createElement('div');box.className='shot';const title=document.createElement('h3');title.textContent=`鏡頭 ${s.number||i+1}｜${s.seconds||5} 秒`;box.append(title);for(const [label,key] of [['畫面','visual'],['運鏡','camera'],['對白','dialogue'],['影像提示','prompt']]){const p=document.createElement('p');p.textContent=label+'：'+(s[key]||'—');box.append(p)}$('shots').append(box)});$('export').disabled=false;status('✅ 已生成 '+data.length+' 個 AI 分鏡')}catch(e){status('❌ '+(e.name==='AbortError'?'連線逾時':e.message))}finally{busy(false)}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(shotData,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-film-studio-v3-shots.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
