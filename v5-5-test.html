<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Film-Studio V5.5 合成測試</title><style>*{box-sizing:border-box}body{margin:0;background:#11101b;color:#f6f0ff;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:780px;margin:auto;padding:20px 15px 70px}h1{font-size:26px;color:#d3b2ff}.panel{background:#262034;border:1px solid #57466d;border-radius:16px;padding:17px;margin:15px 0}p,small{color:#c6bfd1;line-height:1.6}label{display:block;margin:10px 0 5px;font-weight:600}input,textarea{width:100%;padding:10px;background:#171320;border:1px solid #796c8e;color:white;border-radius:9px;font:inherit}textarea{min-height:70px}button{background:#b999ff;color:#20132d;border:0;border-radius:10px;padding:13px 16px;font-weight:750;margin:8px 8px 0 0}button:disabled{opacity:.45}.hint{background:#342941;padding:12px;border-radius:10px;line-height:1.65}.status{background:#30283f;padding:13px;border-radius:10px;white-space:pre-wrap}video{width:100%;border-radius:10px;margin-top:12px}a{color:#e2caff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🎬 AI-Film-Studio V5.5</h1><p>《霓虹舊夢》四鏡頭影片＋自然配音＋中文字幕合成測試</p><div class="panel"><div class="hint"><b>測試版：</b>直接在本機瀏覽器合成，不上傳影片。優先使用 MP4；若 Safari 不支援所需錄製功能，會明確顯示原因，不會產生假的 MP4。建議先用短影片測試。<br>⚠️ 本版尚未提供人物嘴型同步；音檔是後製配音。</div><p id="support">正在檢查瀏覽器支援...</p><label>作品名稱<input id="title" value="霓虹舊夢"></label><label>影片尺寸</label><select id="size" style="padding:10px;background:#171320;color:white;border-radius:8px"><option value="640x360">橫式 640×360（先測試，較省記憶體）</option><option value="360x640">直式 360×640</option><option value="1280x720">橫式 1280×720（較耗資源）</option></select></div><div id="shots"></div><div class="panel"><h2>合成與下載</h2><p>配音預設在各鏡頭開始後 1 秒播放，可自行修改。字幕會顯示於畫面底部。</p><button id="go">▶ 合成完整影片</button><button id="cancel" disabled>停止合成</button><div id="status" class="status" role="status">請先選取四段影片和四段配音。</div><video id="result" controls playsinline hidden></video><p id="link"></p></div><canvas id="canvas" hidden></canvas><video id="source" playsinline preload="auto" muted style="display:none"></video></main><script>
const defaults=[['曼菁','文遠？',6,2,2],['文遠','曼菁……真的是妳？',5,1,3],['曼菁','七年了……你還記得我。',5,1,3],['文遠','這一次……我不會再錯過妳。',5,1,3]];const shots=defaults.map(([role,text,duration,offset,show])=>({role,text,duration,offset,show,video:null,audio:null}));const $=x=>document.getElementById(x);const status=s=>$('status').textContent=s;let cancelled=false,busy=false,recorder=null,activeCtx=null,activeVideo=null;function el(tag,parent,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent.append(e);return e}function edit(parent,s,key,label,type='text'){const l=el('label',parent,label),e=el(type==='textarea'?'textarea':'input',l);if(type!=='textarea')e.type=type;e.value=s[key];e.oninput=()=>s[key]=type==='number'?Math.max(0,Number(e.value)||0):e.value;return e}shots.forEach((s,i)=>{const p=el('section',$('shots'));p.className='panel';el('h2',p,'鏡頭 '+String(i+1).padStart(2,'0')+' · '+s.role);edit(p,s,'text','字幕台詞','textarea');const g=el('div',p);g.className='grid';edit(g,s,'duration','鏡頭秒數','number');edit(g,s,'offset','配音及字幕開始秒數','number');edit(p,s,'show','字幕顯示秒數','number');for(const kind of ['video','audio']){el('label',p,kind==='video'?'選取影片 MP4':'選取自然配音 MP3 / M4A / WAV');const f=el('input',p);f.type='file';f.accept=kind==='video'?'video/*,.mp4,.mov':'audio/*,.mp3,.m4a,.wav';const n=el('small',p,'尚未選取');f.onchange=()=>{s[kind]=f.files?.[0]||null;n.textContent=s[kind]?'已選：'+s[kind].name:'尚未選取'}}});function bestMime(){for(const t of ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])if(MediaRecorder.isTypeSupported(t))return t;return ''}const supported=typeof MediaRecorder!=='undefined'&&typeof HTMLCanvasElement.prototype.captureStream==='function'&&typeof AudioContext!=='undefined';const mime=supported?bestMime():'';$('support').textContent=!supported?'此瀏覽器缺少錄影合成必要功能（MediaRecorder / canvas.captureStream / AudioContext）。可改用電腦 Chrome 或更新 iOS Safari 測試。':mime?'目前可嘗試輸出：'+(mime.includes('mp4')?'MP4':'WebM')+'（'+mime+'）。是否能成功仍需實際測試。':'此瀏覽器沒有可用的錄影格式。';$('go').disabled=!supported||!mime;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function waitEvent(target,good,bad,timeout=15000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>done(new Error('等待媒體逾時')),timeout);function done(err){clearTimeout(timer);target.removeEventListener(good,ok);if(bad)target.removeEventListener(bad,fail);err?reject(err):resolve()}function ok(){done()}function fail(){done(new Error('影片無法解碼或載入'))}target.addEventListener(good,ok,{once:true});if(bad)target.addEventListener(bad,fail,{once:true})})}function caption(ctx,text,w,h){const font=Math.max(19,Math.round(w/25));ctx.font='bold '+font+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const chars=Array.from(text);const lines=[];let line='';for(const c of chars){if(ctx.measureText(line+c).width>w*.85&&line){lines.push(line);line=c}else line+=c}if(line)lines.push(line);const lh=font*1.4,base=h-34-(lines.length-1)*lh;ctx.lineWidth=Math.max(3,font/5);ctx.strokeStyle='rgba(0,0,0,.9)';ctx.fillStyle='#fff';lines.forEach((x,i)=>{ctx.strokeText(x,w/2,base+i*lh);ctx.fillText(x,w/2,base+i*lh)})}function draw(ctx,video,w,h,s,local){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);if(video.readyState>=2&&video.videoWidth){const sw=video.videoWidth,sh=video.videoHeight,scale=Math.min(w/sw,h/sh),dw=sw*scale,dh=sh*scale;ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh)}if(local>=s.offset&&local<=s.offset+s.show&&s.text.trim())caption(ctx,s.text,w,h)}function stopAll(){cancelled=true;try{recorder?.state==='recording'&&recorder.stop()}catch(e){}try{activeVideo?.pause()}catch(e){}try{activeCtx?.close()}catch(e){}}$('cancel').onclick=stopAll;async function run(){if(busy)return;const missing=shots.findIndex(s=>!s.video||!s.audio);if(missing>=0)return status('鏡頭 '+(missing+1)+' 尚未同時選取 MP4 影片及配音音檔。');busy=true;cancelled=false;$('go').disabled=true;$('cancel').disabled=false;$('result').hidden=true;$('link').replaceChildren();let ctxAudio,stream,urls=[];try{const [w,h]=$('size').value.split('x').map(Number),canvas=$('canvas'),ctx=canvas.getContext('2d');canvas.width=w;canvas.height=h;ctx.fillStyle='black';ctx.fillRect(0,0,w,h);const source=$('source');activeVideo=source;source.muted=true;source.playsInline=true;ctxAudio=new AudioContext();activeCtx=ctxAudio;await ctxAudio.resume();const destination=ctxAudio.createMediaStreamDestination();const buffers=[];for(let i=0;i<shots.length;i++){status('正在讀取配音 '+(i+1)+'/4...');const array=await shots[i].audio.arrayBuffer();buffers.push(await ctxAudio.decodeAudioData(array))}const videoStream=canvas.captureStream(24);stream=new MediaStream([...videoStream.getVideoTracks(),...destination.stream.getAudioTracks()]);const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000,audioBitsPerSecond:128000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const ended=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=e=>reject(new Error('錄製失敗：'+(e.error?.message||'未知錯誤')))});recorder.start(1000);for(let i=0;i<shots.length;i++){if(cancelled)break;const s=shots[i];status('正在合成鏡頭 '+(i+1)+'/4，請保持 Safari 在前景，不要鎖定螢幕。');const url=URL.createObjectURL(s.video);urls.push(url);source.src=url;source.load();await waitEvent(source,'loadeddata','error',20000);source.currentTime=0;await source.play();const start=performance.now();let audioStarted=false;const duration=Math.min(Math.max(.1,Number(s.duration)||5),120);while(!cancelled){const local=(performance.now()-start)/1000;if(local>=duration)break;if(!audioStarted&&local>=s.offset){const node=ctxAudio.createBufferSource();node.buffer=buffers[i];node.connect(destination);node.start();audioStarted=true}draw(ctx,source,w,h,s,local);await sleep(32)}source.pause();draw(ctx,source,w,h,s,duration);URL.revokeObjectURL(url);urls.pop()}if(recorder.state==='recording')recorder.stop();await ended;if(cancelled)throw Error('已停止合成。');if(!chunks.length)throw Error('未取得錄影資料。');const extension=mime.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:mime}),output=URL.createObjectURL(blob);const video=$('result');video.src=output;video.hidden=false;const a=el('a',$('link'),'下載完整影片（.'+extension+'）');a.href=output;a.download=($('title').value||'霓虹舊夢')+'_V5.5.'+extension;status('合成完成！請先按播放確認配音與字幕。輸出格式：'+extension+'。如果聲音或畫面不正確，請回報測試結果。')}catch(e){status('合成未完成：'+e.message+'\n請截圖此訊息，我會依照 iPhone 的實際限制調整。')}finally{urls.forEach(u=>URL.revokeObjectURL(u));try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}try{await ctxAudio?.close()}catch(e){}busy=false;$('go').disabled=!supported||!mime;$('cancel').disabled=true;recorder=null;activeCtx=null;activeVideo=null}}$('go').onclick=run;
</script></body></html>
